name: Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci

    - name: Build JS bundle
      run: npm run build

    - name: Run Tests
      run: npm test

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: simple-note-build
        path: |
          public/
          server.js
          package.json
          package-lock.json
          setup.sh
          README.md
